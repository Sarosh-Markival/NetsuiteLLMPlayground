<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM Playground</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bs-gray-100);
      }

      .chat-container {
        height: calc(100vh - 120px);
        display: flex;
        flex-direction: column;
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
      }

      .message {
        max-width: 80%;
        margin-bottom: 1rem;
        padding: 0.75rem 1rem;
        border-radius: 1rem;
        position: relative;
      }

      .message.user {
        margin-left: auto;
        background-color: var(--bs-primary);
        color: white;
      }

      .message.bot {
        margin-right: auto;
        background-color: var(--bs-light);
        border: 1px solid var(--bs-gray-200);
      }

      .message.error {
        background-color: var(--bs-danger-subtle);
        border: 1px solid var(--bs-danger);
        color: var(--bs-danger);
      }

      .message-icon {
        position: absolute;
        bottom: -0.5rem;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.875rem;
      }

      .message.user .message-icon {
        right: -0.5rem;
        background-color: var(--bs-primary-dark, var(--bs-primary));
        color: white;
      }

      .message.bot .message-icon {
        left: -0.5rem;
        background-color: var(--bs-light);
        border: 1px solid var(--bs-gray-200);
        color: var(--bs-primary);
      }

      .input-container {
        background-color: white;
        border-top: 1px solid var(--bs-gray-200);
        padding: 1rem;
      }

      .chat-input {
        resize: none;
      }

      .model-settings {
        width: 350px;
      }

      .embed-container {
        height: calc(100vh - 120px);
      }

      #embedInput {
        height: 200px;
      }
    </style>
  </head>
  <body>
    <!-- Tabs -->
    <ul class="nav nav-tabs" id="mainTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button
          class="nav-link active"
          data-bs-toggle="tab"
          data-bs-target="#chatTab"
          type="button"
          role="tab"
          aria-selected="true"
        >
          <i class="fas fa-comments me-2"></i>Chat
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button
          class="nav-link"
          data-bs-toggle="tab"
          data-bs-target="#embeddingsTab"
          type="button"
          role="tab"
          aria-selected="false"
        >
          <i class="fas fa-vector-square me-2"></i>Embeddings
        </button>
      </li>
    </ul>

    <!-- Tab Content -->
    <div class="tab-content">
      <!-- Chat Tab -->
      <div class="tab-pane fade show active" id="chatTab" role="tabpanel">
        <div class="chat-container">
          <div class="chat-messages bg-white shadow-sm" id="chatMessages"></div>
          <div class="input-container">
            <div class="d-flex gap-2">
              <div class="flex-grow-1">
                <textarea
                  class="form-control chat-input"
                  id="chatInput"
                  rows="1"
                  placeholder="Type your message..."
                  aria-label="Chat input"
                ></textarea>
              </div>
              <div class="d-flex gap-2">
                <button
                  class="btn btn-primary"
                  id="sendButton"
                  aria-label="Send message"
                >
                  <i class="fas fa-paper-plane"></i>
                </button>
                <button
                  class="btn btn-outline-secondary"
                  id="clearButton"
                  aria-label="Clear chat"
                >
                  <i class="fas fa-trash"></i>
                </button>
                <button
                  class="btn btn-outline-secondary"
                  type="button"
                  data-bs-toggle="offcanvas"
                  data-bs-target="#modelSettings"
                  aria-controls="modelSettings"
                >
                  <i class="fas fa-cog"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Embeddings Tab -->
      <div class="tab-pane fade" id="embeddingsTab" role="tabpanel">
        <div class="embed-container p-3">
          <div class="card shadow-sm">
            <div class="card-body">
              <div class="mb-3">
                <label for="embedInput" class="form-label"
                  >Input Text (one item per line)</label
                >
                <textarea
                  class="form-control"
                  id="embedInput"
                  rows="5"
                  aria-label="Embedding input"
                ></textarea>
              </div>
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label for="embedModelFamily" class="form-label"
                    >Embedding Model</label
                  >
                  <select
                    class="form-select"
                    id="embedModelFamily"
                    aria-label="Embedding model selection"
                  ></select>
                </div>
                <div class="col-md-6">
                  <label for="truncate" class="form-label"
                    >Truncation Method</label
                  >
                  <select
                    class="form-select"
                    id="truncate"
                    aria-label="Truncation method selection"
                  ></select>
                </div>
              </div>
              <button class="btn btn-primary" id="generateEmbeddings">
                <i class="fas fa-vector-square me-2"></i>Generate Embeddings
              </button>
              <hr />
              <pre class="bg-light p-3 rounded mb-0" id="embedResponse">
Response will appear here...</pre
              >
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Model Settings Offcanvas -->
    <div
      class="offcanvas offcanvas-end model-settings"
      id="modelSettings"
      tabindex="-1"
    >
      <div class="offcanvas-header">
        <h5 class="offcanvas-title">Model Settings</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"
          aria-label="Close"
        ></button>
      </div>
      <div class="offcanvas-body">
        <form>
          <div class="mb-3">
            <label for="modelFamily" class="form-label">Model Family</label>
            <select
              class="form-select"
              id="modelFamily"
              aria-label="Model family selection"
            ></select>
          </div>
          <div class="mb-3">
            <label for="temperature" class="form-label">Temperature</label>
            <input
              type="number"
              class="form-control"
              id="temperature"
              min="0"
              max="1"
              step="0.1"
              value="0.7"
            />
          </div>
          <div class="mb-3">
            <label for="maxTokens" class="form-label">Max Tokens</label>
            <input
              type="number"
              class="form-control"
              id="maxTokens"
              min="1"
              value="1024"
            />
          </div>
          <div class="mb-3">
            <label for="topK" class="form-label">Top K</label>
            <input
              type="number"
              class="form-control"
              id="topK"
              min="0"
              value="50"
            />
          </div>
          <div class="mb-3">
            <label for="topP" class="form-label">Top P</label>
            <input
              type="number"
              class="form-control"
              id="topP"
              min="0"
              max="1"
              step="0.1"
              value="0.9"
            />
          </div>
          <div class="mb-3">
            <label for="frequencyPenalty" class="form-label"
              >Frequency Penalty</label
            >
            <input
              type="number"
              class="form-control"
              id="frequencyPenalty"
              min="0"
              max="2"
              step="0.1"
              value="0"
            />
          </div>
          <div class="mb-3">
            <label for="presencePenalty" class="form-label"
              >Presence Penalty</label
            >
            <input
              type="number"
              class="form-control"
              id="presencePenalty"
              min="0"
              max="2"
              step="0.1"
              value="0"
            />
          </div>
          <button
            type="button"
            class="btn btn-primary w-100"
            data-bs-dismiss="offcanvas"
          >
            <i class="fas fa-save me-2"></i>Save Settings
          </button>
        </form>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
